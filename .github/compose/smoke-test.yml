services:
  odysseus:
    image: ${ODYSSEUS_CANDIDATE_IMAGE:?candidate image is required}
    platform: ${ODYSSEUS_TEST_PLATFORM:-linux/amd64}
    ports: !reset []
    environment:
      AUTH_ENABLED: "false"
      ODYSSEUS_ADMIN_PASSWORD: odysseus-compose-smoke-test-password
      ODYSSEUS_STARTUP_WARMUPS: "0"

  chromadb:
    ports: !reset []

  searxng:
    ports: !reset []

  ntfy:
    ports: !reset []
