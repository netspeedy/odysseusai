name: Build and Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Sync Deployment Bundle dispatches this on its pull request branch, because
  # pull requests opened with GITHUB_TOKEN don't trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: odysseus-dev/odysseus

jobs:
  lint:
    name: Lint and Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows
        run: make actionlint

      - name: Lint shell scripts
        run: shellcheck -x .github/scripts/*.sh

      - name: Run pipeline unit tests
        run: python3 -m unittest discover -s .github/scripts/tests

  patches:
    name: Packaging on Upstream ${{ matrix.upstream_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        upstream_branch:
          - main
          - dev

    # Every patch and constraint has to apply cleanly to the current upstream
    # branch, and upstream's tests for the patched code have to pass with them.
    # The image pipeline repeats both before it builds.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout upstream ${{ matrix.upstream_branch }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.upstream_branch }}
          fetch-depth: 1
          path: upstream
          persist-credentials: false

      - name: Apply packaging compatibility changes
        run: >-
          python3 .github/scripts/image_pipeline.py prepare
          --source upstream
          --constraints .github/constraints/requirements.txt
          --patches .github/patches

      # Upstream code runs in this environment, so nothing it touches is cached.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Run upstream tests for the patched code
        run: .github/scripts/test-upstream.sh upstream

  bundle:
    name: Deployment Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose files
        run: .github/scripts/validate-bundle.sh

      - name: Smoke test bundled SearXNG
        run: .github/scripts/smoke-test-searxng.sh

      # Boots the bundle's ChromaDB, SearXNG and ntfy pins with the published
      # stable image, so a Dependabot or sync bump is tested before it merges.
      - name: Smoke test Compose stack
        run: .github/scripts/smoke-test-compose.sh ghcr.io/netspeedy/odysseusai:latest
