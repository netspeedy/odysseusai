name: Odysseus Container Pipeline

on:
  push:
    branches:
      - main
    paths:
      - .github/compose/**
      - .github/constraints/**
      - .github/patches/**
      - .github/workflows/build-image.yml
      - .github/scripts/**
      - config/searxng/**
      - docker-compose.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: Publish new stable and development images when inputs are unchanged
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - upstream-updated

permissions:
  actions: read
  contents: read

concurrency:
  group: odysseus-container-pipeline
  cancel-in-progress: false

env:
  IMAGE_DESCRIPTION: Independent prebuilt container for Odysseus, built automatically from the official upstream source. This project publishes images and deployment files only.
  IMAGE_NAME: ghcr.io/netspeedy/odysseusai
  PACKAGING_SCHEMA: "8"
  UPSTREAM_REPOSITORY: odysseus-dev/odysseus
  FORCE_BUILD: ${{ inputs.force_build || github.event.client_payload.force_build || github.event.client_payload.force || false }}

jobs:
  sync_deployment:
    name: Sync Deployment Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      packaging_sha: ${{ steps.publish.outputs.packaging_sha }}
      upstream_sha: ${{ steps.publish.outputs.upstream_sha }}

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: packaging

      - name: Checkout upstream stable source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: upstream

      - name: Synchronize upstream runtime files
        working-directory: packaging
        run: .github/scripts/sync-upstream-runtime.sh ../upstream .

      - name: Validate deployment bundle
        working-directory: packaging
        run: docker compose --env-file .env.example config --quiet

      - name: Smoke test synchronized SearXNG
        working-directory: packaging
        run: .github/scripts/smoke-test-searxng.sh

      - name: Publish deployment bundle changes
        id: publish
        working-directory: packaging
        run: .github/scripts/publish-runtime-sync.sh ../upstream

  publish:
    name: ${{ matrix.job_name }}
    needs: sync_deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream_branch: main
            channel_name: Stable
            job_name: Publish Stable Image
            moving_tags: latest, main
          - upstream_branch: dev
            channel_name: Development
            job_name: Publish Development Image
            moving_tags: dev

    steps:
      - name: Checkout pipeline source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync_deployment.outputs.packaging_sha }}
          persist-credentials: false

      - name: Checkout upstream source
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.upstream_branch }}
          fetch-depth: 1
          persist-credentials: false
          path: upstream

      - name: Apply packaging compatibility changes
        id: packaging
        run: >-
          python3 .github/scripts/image_pipeline.py prepare
          --source upstream
          --constraints .github/constraints/requirements.txt
          --patches .github/patches

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan image publication
        id: plan
        env:
          CHANNEL_NAME: ${{ matrix.channel_name }}
          MOVING_TAGS: ${{ matrix.moving_tags }}
          PACKAGING_CONSTRAINTS: ${{ steps.packaging.outputs.constraints }}
          PACKAGING_CONSTRAINT_FINGERPRINT: ${{ steps.packaging.outputs.constraint_fingerprint }}
          PACKAGING_PATCHES: ${{ steps.packaging.outputs.patches }}
          PACKAGING_PATCH_FINGERPRINT: ${{ steps.packaging.outputs.patch_fingerprint }}
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: >-
          python3 .github/scripts/image_pipeline.py plan
          --source upstream
          --result build-results/${{ matrix.upstream_branch }}.json

      - name: Generate image metadata
        if: steps.plan.outputs.action == 'build'
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.upstream_branch }}
            type=raw,value=${{ steps.plan.outputs.version }}
            type=raw,value=latest,enable=${{ matrix.upstream_branch == 'main' }}
          labels: |
            org.opencontainers.image.title=Odysseus AI
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/netspeedy/odysseusai
            org.opencontainers.image.url=https://odysseus-dev.github.io/odysseus
            org.opencontainers.image.documentation=https://github.com/netspeedy/odysseusai#readme
            org.opencontainers.image.revision=${{ steps.plan.outputs.upstream_sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.created=${{ steps.plan.outputs.build_created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            io.netspeedy.odysseus.upstream=https://github.com/odysseus-dev/odysseus
            io.netspeedy.odysseus.channel=${{ matrix.upstream_branch }}
            io.netspeedy.odysseus.packaging-schema=${{ env.PACKAGING_SCHEMA }}
            io.netspeedy.odysseus.packaging-constraints=${{ steps.packaging.outputs.constraints }}
            io.netspeedy.odysseus.packaging-constraint-fingerprint=${{ steps.packaging.outputs.constraint_fingerprint }}
            io.netspeedy.odysseus.packaging-patches=${{ steps.packaging.outputs.patches }}
            io.netspeedy.odysseus.packaging-patch-fingerprint=${{ steps.packaging.outputs.patch_fingerprint }}
            io.netspeedy.odysseus.base-image-fingerprint=${{ steps.plan.outputs.base_fingerprint }}
            io.netspeedy.odysseus.base-images=${{ steps.plan.outputs.base_images }}
          annotations: |
            org.opencontainers.image.title=Odysseus AI
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/netspeedy/odysseusai
            org.opencontainers.image.url=https://odysseus-dev.github.io/odysseus
            org.opencontainers.image.documentation=https://github.com/netspeedy/odysseusai#readme
            org.opencontainers.image.revision=${{ steps.plan.outputs.upstream_sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.created=${{ steps.plan.outputs.build_created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build candidate image
        if: steps.plan.outputs.action == 'build'
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: upstream
          platforms: linux/amd64
          pull: true
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=odysseus-${{ matrix.upstream_branch }}
          cache-to: type=gha,mode=max,scope=odysseus-${{ matrix.upstream_branch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test candidate image
        if: steps.plan.outputs.action == 'build'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: .github/scripts/smoke-test-image.sh "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Smoke test candidate Compose stack
        if: steps.plan.outputs.action == 'build'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: .github/scripts/smoke-test-compose.sh "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Smoke test current Compose stack
        if: steps.plan.outputs.action == 'skip'
        run: .github/scripts/smoke-test-compose.sh "${IMAGE_NAME}:${{ matrix.upstream_branch }}"

      - name: Promote tested image
        if: steps.plan.outputs.action == 'build'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: python3 .github/scripts/image_pipeline.py promote

      - name: Remove failed candidate image
        if: failure() && steps.build.outputs.digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 .github/scripts/image_pipeline.py cleanup

      - name: Report unchanged image
        if: steps.plan.outputs.action == 'skip'
        env:
          CHANNEL_NAME: ${{ matrix.channel_name }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
        run: >-
          printf '%s image is current at upstream revision %.12s (%s).\n'
          "${CHANNEL_NAME}" "${UPSTREAM_SHA}" "${PLAN_REASON}"

      - name: Verify published image
        env:
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          BASE_IMAGE_FINGERPRINT: ${{ steps.plan.outputs.base_fingerprint }}
          BASE_IMAGES: ${{ steps.plan.outputs.base_images }}
          PACKAGING_CONSTRAINTS: ${{ steps.packaging.outputs.constraints }}
          PACKAGING_CONSTRAINT_FINGERPRINT: ${{ steps.packaging.outputs.constraint_fingerprint }}
          PACKAGING_PATCHES: ${{ steps.packaging.outputs.patches }}
          PACKAGING_PATCH_FINGERPRINT: ${{ steps.packaging.outputs.patch_fingerprint }}
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
        run: >-
          python3 .github/scripts/image_pipeline.py verify
          --result build-results/${{ matrix.upstream_branch }}.json

      - name: Upload channel result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-result-${{ matrix.upstream_branch }}
          path: build-results/${{ matrix.upstream_branch }}.json
          if-no-files-found: error
          retention-days: 1

  publish_stable_channel:
    name: Publish Stable Package Landing Version
    needs:
      - sync_deployment
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      status: ${{ steps.publish.outputs.status }}

    steps:
      - name: Checkout pipeline source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync_deployment.outputs.packaging_sha }}
          persist-credentials: false

      - name: Download image results
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-result-*
          path: build-results
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable package landing version
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .github/scripts/image_pipeline.py publish-stable-channel
          --results build-results

  summary:
    name: Run Summary
    if: ${{ always() }}
    needs:
      - sync_deployment
      - publish
      - publish_stable_channel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout pipeline source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download image results
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-result-*
          path: build-results
          merge-multiple: true

      - name: Write run summary
        env:
          BUILD_RESULT: ${{ needs.publish.result }}
          SYNC_CHANGED: ${{ needs.sync_deployment.outputs.changed }}
          SYNC_RESULT: ${{ needs.sync_deployment.result }}
          SYNC_UPSTREAM_SHA: ${{ needs.sync_deployment.outputs.upstream_sha }}
        run: python3 .github/scripts/write_summary.py --results build-results
