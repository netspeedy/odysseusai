name: Build Odysseus image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-image.yml
      - .github/scripts/sync-upstream-runtime.sh
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a new CalVer build even when upstream is unchanged
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - upstream-updated

permissions:
  contents: read

concurrency:
  group: odysseusai-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/netspeedy/odysseusai
  UPSTREAM_REPOSITORY: odysseus-dev/odysseus
  FORCE_BUILD: ${{ inputs.force || github.event.client_payload.force || false }}

jobs:
  sync-deployment:
    name: Sync deployment package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout image repository
        uses: actions/checkout@v5
        with:
          ref: main
          path: packaging

      - name: Checkout upstream stable source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: main
          fetch-depth: 1
          path: upstream

      - name: Sync upstream runtime files
        working-directory: packaging
        run: .github/scripts/sync-upstream-runtime.sh ../upstream .

      - name: Validate deployment package
        working-directory: packaging
        run: docker compose --env-file .env.example config --quiet

      - name: Publish upstream runtime changes
        working-directory: packaging
        shell: bash
        run: |
          set -euo pipefail

          git add \
            .env.example \
            LICENSE \
            docker-compose.yml \
            config/searxng/settings.yml \
            docker/gpu.amd.yml \
            docker/gpu.nvidia.yml \
            docker/host-docker.yml

          if git diff --cached --quiet; then
            echo "Deployment package already matches upstream main."
            exit 0
          fi

          upstream_sha="$(git -C ../upstream rev-parse --short=12 HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Odysseus runtime ${upstream_sha}"
          git push origin HEAD:main

  build:
    name: Build and publish (${{ matrix.upstream_branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        upstream_branch:
          - main
          - dev

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ matrix.upstream_branch }}
          fetch-depth: 1
          path: upstream

      - name: Read upstream revision
        id: upstream
        working-directory: upstream
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          build_created="$(git show -s --format=%cI HEAD)"

          {
            echo "sha=${sha}"
            echo "build_created=${build_created}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GitHub Container Registry image state
        id: published
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: |
          set -euo pipefail

          image_label() {
            local tag="$1"
            local label="$2"
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:${tag}" \
              --format "{{ index .Image.Config.Labels \"${label}\" }}" \
              2>/dev/null || true
          }

          branch_revision="$(image_label "${UPSTREAM_BRANCH}" "org.opencontainers.image.revision")"
          branch_version="$(image_label "${UPSTREAM_BRANCH}" "org.opencontainers.image.version")"
          latest_revision=""
          if [ "${UPSTREAM_BRANCH}" = "main" ]; then
            latest_revision="$(image_label latest "org.opencontainers.image.revision")"
          fi

          {
            echo "branch_revision=${branch_revision}"
            echo "branch_version=${branch_version}"
            echo "latest_revision=${latest_revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Decide whether to build or skip
        id: decision
        shell: bash
        env:
          BRANCH_REVISION: ${{ steps.published.outputs.branch_revision }}
          BRANCH_VERSION: ${{ steps.published.outputs.branch_version }}
          LATEST_REVISION: ${{ steps.published.outputs.latest_revision }}
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail

          version_is_calver=false
          if [ "${UPSTREAM_BRANCH}" = "main" ] && [[ "${BRANCH_VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            version_is_calver=true
          elif [ "${UPSTREAM_BRANCH}" = "dev" ] && [[ "${BRANCH_VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*-dev$ ]]; then
            version_is_calver=true
          fi

          action=build
          if [ "${FORCE_BUILD}" != "true" ] \
            && [ "${BRANCH_REVISION}" = "${UPSTREAM_SHA}" ] \
            && [ "${version_is_calver}" = "true" ] \
            && { [ "${UPSTREAM_BRANCH}" != "main" ] || [ "${LATEST_REVISION}" = "${UPSTREAM_SHA}" ]; }; then
            action=skip
          fi

          echo "action=${action}" >> "${GITHUB_OUTPUT}"

      - name: Select CalVer image tag
        if: steps.decision.outputs.action == 'build'
        id: version
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: |
          set -euo pipefail

          date_version="$(date -u +%Y.%m.%d)"
          suffix=""
          if [ "${UPSTREAM_BRANCH}" = "dev" ]; then
            suffix="-dev"
          fi

          sequence=1
          while docker buildx imagetools inspect \
            "${IMAGE_NAME}:${date_version}.${sequence}${suffix}" >/dev/null 2>&1; do
            sequence=$((sequence + 1))
          done

          echo "tag=${date_version}.${sequence}${suffix}" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        if: steps.decision.outputs.action == 'build'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.upstream_branch }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ matrix.upstream_branch == 'main' }}
          labels: |
            org.opencontainers.image.title=Odysseus AI
            org.opencontainers.image.description=Prebuilt Odysseus image from odysseus-dev/odysseus.
            org.opencontainers.image.source=https://github.com/netspeedy/odysseusai
            org.opencontainers.image.url=https://github.com/odysseus-dev/odysseus
            org.opencontainers.image.documentation=https://github.com/netspeedy/odysseusai#readme
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.upstream.outputs.build_created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            io.netspeedy.odysseus.upstream=https://github.com/odysseus-dev/odysseus
            io.netspeedy.odysseus.channel=${{ matrix.upstream_branch }}

      - name: Build and push image
        if: steps.decision.outputs.action == 'build'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=odysseus-${{ matrix.upstream_branch }}
          cache-to: type=gha,mode=max,scope=odysseus-${{ matrix.upstream_branch }}

      - name: Skip unchanged upstream revision
        if: steps.decision.outputs.action == 'skip'
        shell: bash
        run: |
          echo "${{ matrix.upstream_branch }} already contains upstream revision ${{ steps.upstream.outputs.sha }}."
